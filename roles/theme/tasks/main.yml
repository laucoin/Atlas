---
- name: Ensure the shared theme directory exists
  ansible.builtin.file:
    path: "{{ theme_shared_dir }}"
    state: directory
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_user }}"
    mode: "0755"

- name: Render the shared palette stylesheet
  ansible.builtin.template:
    src: palette.css.j2
    dest: "{{ theme_shared_dir }}/palette.css"
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_user }}"
    mode: "0644"

- name: Render the error-pages stack
  ansible.builtin.import_tasks: error_pages_stack.yml

- name: Render the dashboard
  ansible.builtin.import_tasks: dashboard.yml

- name: Host the dashboard and wire its route
  ansible.builtin.import_tasks: dashboard_hosting.yml

- name: Activate the static-content stacks
  ansible.builtin.import_tasks: activate_static_stacks.yml
