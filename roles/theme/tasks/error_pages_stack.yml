---
# Rootless Docker maps this container's non-zero internal UID to a
# DIFFERENT host UID than the atlas-docker daemon user — see traefik's
# and authelia's own fixes for the full reasoning. Anything actually
# bind-mounted into the error-pages container needs this UID, not
# docker_service_user.
- name: Compute the error-pages container's host-mapped UID
  ansible.builtin.set_fact:
    theme_error_pages_host_uid: "{{ docker_subuid_start + theme_error_pages_uid - 1 }}"

- name: Ensure the error-pages stack directory exists
  ansible.builtin.file:
    path: "{{ theme_error_pages_stack_dir }}"
    state: directory
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_user }}"
    mode: "0750"

- name: Ensure the html directory exists, owned for the container
  ansible.builtin.file:
    path: "{{ theme_error_pages_stack_dir }}/html"
    state: directory
    owner: "{{ theme_error_pages_host_uid }}"
    group: "{{ theme_error_pages_host_uid }}"
    mode: "0750"

- name: Render the themed error page
  ansible.builtin.template:
    src: error.html.j2
    dest: "{{ theme_error_pages_stack_dir }}/html/error.html"
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_user }}"
    mode: "0644"

- name: Render the error-pages nginx configuration
  ansible.builtin.template:
    src: error-pages-nginx.conf.j2
    dest: "{{ theme_error_pages_stack_dir }}/nginx.conf"
    owner: "{{ theme_error_pages_host_uid }}"
    group: "{{ theme_error_pages_host_uid }}"
    mode: "0644"

- name: Render the error-pages Compose file
  ansible.builtin.template:
    src: error-pages-compose.yml.j2
    dest: "{{ theme_error_pages_stack_dir }}/compose.yml"
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_user }}"
    mode: "0640"
  register: theme_error_pages_compose
