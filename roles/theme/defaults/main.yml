---
theme_shared_dir: /srv/theme

# Apple's system blue — "system blue" evokes exactly this well-known design
# language ("in the manner of a well-made desktop operating system", per
# functional/features/unified-theme). Semantic colors (success/warning/
# error) are drawn from the same design system, so the palette reads as one
# coherent whole rather than an accent color paired with arbitrary status
# colors.
atlas_palette:
  light:
    accent: "#007AFF"
    background: "#FFFFFF"
    surface: "#F5F5F7"
    border: "#D2D2D7"
    text: "#1D1D1F"
    text_muted: "#6E6E73"
    success: "#34C759"
    warning: "#FF9500"
    error: "#FF3B30"
  dark:
    accent: "#0A84FF"
    background: "#000000"
    surface: "#1C1C1E"
    border: "#38383A"
    text: "#F5F5F7"
    text_muted: "#98989D"
    success: "#30D158"
    warning: "#FF9F0A"
    error: "#FF453A"

theme_error_pages_stack_dir: /srv/theme/error-pages
theme_error_pages_uid: 2010
theme_error_pages_image: "nginx:alpine"
theme_error_pages_port: 8080
theme_error_pages_container: atlas-error-pages

theme_dashboard_stack_dir: /srv/theme/dashboard

# Declares every service that appears on the dashboard, per unified-theme
# rule 5: "rendered from the same declarations that define the services."
# Empty for now — no service role has landed yet to declare one (Phase 3).
# Each future entry: {name, subdomain, description}.
atlas_services: []
