---
- name: Set the declared directives in Debian's shipped sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}\\b.*"
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "Port", value: "{{ hardening_ssh_port }}" }
    - { key: "PermitRootLogin", value: "no" }
    - { key: "PasswordAuthentication", value: "no" }
    - { key: "KbdInteractiveAuthentication", value: "no" }
    - { key: "PubkeyAuthentication", value: "yes" }
    - { key: "AllowUsers", value: "{{ hardening_ssh_permitted_user }}" }
    - { key: "LoginGraceTime", value: "{{ hardening_ssh_login_grace_time }}" }
    - { key: "MaxAuthTries", value: "{{ hardening_ssh_max_auth_tries }}" }
    - { key: "KexAlgorithms", value: "{{ hardening_ssh_kex_algorithms | join(',') }}" }
    - { key: "Ciphers", value: "{{ hardening_ssh_ciphers | join(',') }}" }
    - { key: "MACs", value: "{{ hardening_ssh_macs | join(',') }}" }
  loop_control:
    label: "{{ item.key }}"
  register: hardening_sshd_lines

- name: Validate the sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  when: hardening_sshd_lines.changed

- name: Restart sshd if any directive changed
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: hardening_sshd_lines.changed
