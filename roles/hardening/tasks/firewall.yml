---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Render the nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: "nft -c -f %s"
  register: hardening_nftables_config

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Reload the firewall if the ruleset changed
  ansible.builtin.systemd:
    name: nftables
    state: restarted
  when: hardening_nftables_config.changed
