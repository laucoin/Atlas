---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Render the SSH jail
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/10-atlas-sshd.local
    owner: root
    group: root
    mode: "0644"
  register: hardening_fail2ban_config

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Restart fail2ban if the jail configuration changed
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  when: hardening_fail2ban_config.changed
