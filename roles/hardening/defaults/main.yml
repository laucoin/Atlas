---
hardening_ssh_port: 22
hardening_ssh_permitted_user: "{{ atlas_admin_user }}"
hardening_ssh_login_grace_time: 20
hardening_ssh_max_auth_tries: 3

hardening_ssh_kex_algorithms:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512

hardening_ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr

hardening_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com

hardening_firewall_allowed_tcp_ports:
  - "{{ hardening_ssh_port }}"
  - 80
  - 443
  - "{{ forgejo_ssh_port }}"

hardening_sysctl_settings:
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  # Required by sonarqube's embedded Elasticsearch — its bootstrap check
  # refuses to start below this, regardless of container-level limits.
  vm.max_map_count: 524288
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  kernel.randomize_va_space: 2
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  # Declared explicitly, not just left at the Debian default: the rootless
  # Docker runtime (a later role) requires unprivileged user namespaces.
  kernel.unprivileged_userns_clone: 1

# Authelia and home automation add their own jails once those roles exist;
# SSH is the only authentication surface in this phase.
hardening_fail2ban_bantime: 3600
hardening_fail2ban_findtime: 600
hardening_fail2ban_maxretry: 5
