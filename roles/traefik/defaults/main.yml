---
traefik_service_user: "{{ docker_service_user }}"
traefik_stack_dir: /srv/traefik
traefik_uid: 2000

traefik_image: "traefik:v3.7"
traefik_http_port: 8080
traefik_https_port: 8443

atlas_domain: laucoin.fr
atlas_acme_email: luc.aucoin1998@gmail.com

# A fixed subnet, not Docker's own auto-assigned one, so anything that
# needs to trust "traffic from the proxy" by address (homeassistant's
# own trusted_proxies, since it can't trust a hostname) has a stable
# value to reference instead of an unpredictable per-deployment one.
# Chosen outside Docker's default address-pool ranges to avoid colliding
# with another auto-assigned bridge network.
atlas_proxy_network_cidr: 172.28.0.0/24
