---
# Needed early: alloy's own config (host = the rootless docker socket
# path) and its container definition both reference this user's real
# UID, not a rootless-remapped one — see compose.yml.j2's own comment
# for why. Every other role looks this up only in its service.yml,
# right before rendering the systemd unit; alloy needs it this much
# earlier too, for the stack itself.
- name: Look up the docker service user's UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ observability_service_user }}"

- name: Set the docker service user's UID as a fact
  ansible.builtin.set_fact:
    observability_service_uid: "{{ ansible_facts.getent_passwd[observability_service_user][1] }}"

# Rootless Docker maps each container's non-zero internal UID to a
# DIFFERENT host UID than the atlas-docker daemon user — see traefik's
# and authelia's own fixes for the full reasoning. Anything bind-mounted
# INTO a container has to be owned by ITS OWN mapped UID.
- name: Compute each container's host-mapped UID
  ansible.builtin.set_fact:
    observability_victoriametrics_host_uid: "{{ docker_subuid_start + observability_victoriametrics_uid - 1 }}"
    observability_loki_host_uid: "{{ docker_subuid_start + observability_loki_uid - 1 }}"
    observability_grafana_host_uid: "{{ docker_subuid_start + observability_grafana_uid - 1 }}"
    observability_blackbox_host_uid: "{{ docker_subuid_start + observability_blackbox_uid - 1 }}"

- name: Ensure the observability stack directory exists
  ansible.builtin.file:
    path: "{{ observability_stack_dir }}"
    state: directory
    owner: "{{ observability_service_user }}"
    group: "{{ observability_service_user }}"
    mode: "0750"

- name: Ensure each store's data directory exists, owned for its container
  ansible.builtin.file:
    path: "{{ observability_stack_dir }}/{{ item.dir }}/data"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.uid }}"
    mode: "0750"
  loop:
    - { dir: victoriametrics, uid: "{{ observability_victoriametrics_host_uid }}" }
    - { dir: loki, uid: "{{ observability_loki_host_uid }}" }
  loop_control:
    label: "{{ item.dir }}"

- name: Render VictoriaMetrics' scrape configuration
  ansible.builtin.template:
    src: victoriametrics-scrape.yml.j2
    dest: "{{ observability_stack_dir }}/victoriametrics/scrape.yml"
    owner: "{{ observability_victoriametrics_host_uid }}"
    group: "{{ observability_victoriametrics_host_uid }}"
    mode: "0640"
  register: observability_victoriametrics_scrape_config

- name: Ensure blackbox_exporter's config directory exists
  ansible.builtin.file:
    path: "{{ observability_stack_dir }}/blackbox"
    state: directory
    owner: "{{ observability_blackbox_host_uid }}"
    group: "{{ observability_blackbox_host_uid }}"
    mode: "0750"

- name: Render blackbox_exporter's configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ observability_stack_dir }}/blackbox/blackbox.yml"
    owner: "{{ observability_blackbox_host_uid }}"
    group: "{{ observability_blackbox_host_uid }}"
    mode: "0640"
  register: observability_blackbox_configuration

- name: Render Loki's configuration
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: "{{ observability_stack_dir }}/loki/loki-config.yaml"
    owner: "{{ observability_loki_host_uid }}"
    group: "{{ observability_loki_host_uid }}"
    mode: "0640"
  register: observability_loki_configuration

# Owned by the docker service user's own UID, same as the container
# itself — not a per-container rootless-remapped identity, since alloy
# runs as that real UID (compose.yml.j2's own comment explains why).
- name: Ensure alloy's own data directory exists
  ansible.builtin.file:
    path: "{{ observability_stack_dir }}/alloy/data"
    state: directory
    owner: "{{ observability_service_uid }}"
    group: "{{ observability_service_uid }}"
    mode: "0750"

- name: Render alloy's configuration
  ansible.builtin.template:
    src: alloy-config.river.j2
    dest: "{{ observability_stack_dir }}/alloy/config.alloy"
    owner: "{{ observability_service_uid }}"
    group: "{{ observability_service_uid }}"
    mode: "0640"
  register: observability_alloy_configuration

- name: Ensure grafana's own directories exist, owned for the container
  ansible.builtin.file:
    path: "{{ observability_stack_dir }}/grafana/{{ item }}"
    state: directory
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0750"
  loop:
    - data
    - provisioning/datasources
    - provisioning/dashboards
    - provisioning/alerting
    - dashboards

- name: Render Grafana's datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yaml.j2
    dest: "{{ observability_stack_dir }}/grafana/provisioning/datasources/datasources.yaml"
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0640"
  register: observability_grafana_datasources

- name: Render Grafana's dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboard-provisioning.yaml.j2
    dest: "{{ observability_stack_dir }}/grafana/provisioning/dashboards/dashboards.yaml"
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0640"
  register: observability_grafana_dashboard_provisioning

# Plain files, not templates — Grafana's own dashboard JSON already uses
# {{ }} as ITS template syntax (e.g. legend formatting), which would
# collide with Jinja2's if these were rendered instead of copied.
- name: Copy the provisioned dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ observability_stack_dir }}/grafana/dashboards/"
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0640"
  register: observability_grafana_dashboards

- name: Render Grafana's alerting contact points
  ansible.builtin.template:
    src: grafana-contactpoints.yaml.j2
    dest: "{{ observability_stack_dir }}/grafana/provisioning/alerting/contactpoints.yaml"
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0640"
  register: observability_grafana_contactpoints

- name: Render Grafana's alerting notification policies
  ansible.builtin.template:
    src: grafana-notification-policies.yaml.j2
    dest: "{{ observability_stack_dir }}/grafana/provisioning/alerting/notification-policies.yaml"
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0640"
  register: observability_grafana_notification_policies

- name: Render Grafana's alert rules
  ansible.builtin.template:
    src: grafana-alert-rules.yaml.j2
    dest: "{{ observability_stack_dir }}/grafana/provisioning/alerting/rules.yaml"
    owner: "{{ observability_grafana_host_uid }}"
    group: "{{ observability_grafana_host_uid }}"
    mode: "0640"
  register: observability_grafana_alert_rules

- name: Render the observability Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ observability_stack_dir }}/compose.yml"
    owner: "{{ observability_service_user }}"
    group: "{{ observability_service_user }}"
    mode: "0640"
  register: observability_compose
