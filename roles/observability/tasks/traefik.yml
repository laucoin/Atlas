---
# Bind-mounted into the traefik container (./dynamic:/dynamic:ro), so it
# needs traefik's own rootless-remapped UID — traefik_host_uid, not
# observability_service_user.
- name: Wire grafana's route into traefik
  ansible.builtin.template:
    src: traefik-observability.yml.j2
    dest: "{{ traefik_stack_dir }}/dynamic/observability.yml"
    owner: "{{ traefik_host_uid }}"
    group: "{{ traefik_host_uid }}"
    mode: "0640"
