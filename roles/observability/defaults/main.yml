---
observability_service_user: "{{ docker_service_user }}"

# The metrics store, log store and collection agent share one stack
# directory and one systemd unit — unlike the Zigbee bridge split, none
# of these has an independent lifecycle worth protecting; they're
# already coupled (the agent writes into the stores, restarting either
# together is fine).
observability_stack_dir: /srv/observability
observability_network: observability-internal

# observability_victoriametrics_image, observability_loki_image,
# observability_alloy_image, observability_grafana_image and
# observability_blackbox_image all live in
# inventory/group_vars/all/images.yml.
observability_victoriametrics_uid: 2050
observability_victoriametrics_port: 8428
# "Metrics for a year" per functional/features/observability rule 6.
observability_metrics_retention: 1y

observability_loki_uid: 2051
observability_loki_port: 3100
# "Logs for a month" per functional/features/observability rule 6 — a
# duration Loki's own retention_period expects in hours, not a day
# suffix.
observability_logs_retention: 744h

observability_grafana_uid: 2052
observability_grafana_http_port: 3000

observability_blackbox_uid: 2053
observability_blackbox_port: 9115

# "Endpoint checks traverse the full path — proxy, gate and
# application" (rule 2). Each future gated/ungated route should add
# itself here — same "declare once, the automation handles it"
# convention as atlas_services and storage_volumes.
#
# http_gate_up: an unauthenticated request must be redirected to the
# portal — proof the proxy AND the gate are both up, with no
# credentials held here to do it. http_2xx: the three named exceptions
# to the gate, which must answer directly instead.
observability_probe_targets:
  - name: authelia
    url: "https://auth.atlas.{{ atlas_domain }}/"
    module: http_2xx
  - name: dashboard
    url: "https://atlas.{{ atlas_domain }}/"
    module: http_gate_up
  - name: sonarqube
    url: "https://sonarqube.atlas.{{ atlas_domain }}/"
    module: http_gate_up
  - name: grafana
    url: "https://grafana.atlas.{{ atlas_domain }}/"
    module: http_gate_up
  - name: forgejo
    url: "https://forgejo.atlas.{{ atlas_domain }}/"
    module: http_2xx
  - name: homeassistant
    url: "https://homeassistant.atlas.{{ atlas_domain }}/"
    module: http_2xx
