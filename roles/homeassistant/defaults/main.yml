---
homeassistant_service_user: "{{ docker_service_user }}"

# The Zigbee coordinator and its MQTT broker are a separate stack from
# Home Assistant itself, on their own systemd unit — so restarting or
# redeploying the automation application never touches the radio network
# or forces every device to re-pair, per functional/features/home-
# automation rule 2.
homeassistant_bridge_stack_dir: /srv/homeassistant-bridge
homeassistant_bridge_network: homeassistant-internal

homeassistant_mosquitto_uid: 2040
homeassistant_mosquitto_port: 1883

homeassistant_zigbee2mqtt_uid: 2041

homeassistant_stack_dir: /srv/homeassistant
homeassistant_uid: 2042
# homeassistant_mosquitto_image, homeassistant_zigbee2mqtt_image and
# homeassistant_image (including the reasoning for its specific pinned
# version) all live in inventory/group_vars/all/images.yml.
homeassistant_http_port: 8123

# Pinned to a reviewed version, per functional/features/home-automation's
# own accepted risk on this being a community-maintained integration —
# confirmed as the integration Authelia's own docs use as their Home
# Assistant example, and as actively maintained via its release history.
homeassistant_oidc_auth_version: v1.2.1
homeassistant_oidc_client_id: homeassistant
