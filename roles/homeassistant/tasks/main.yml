---
- name: Render the Zigbee bridge stack
  ansible.builtin.import_tasks: bridge_stack.yml

- name: Activate the Zigbee bridge service
  ansible.builtin.import_tasks: bridge_service.yml

- name: Render the homeassistant stack
  ansible.builtin.import_tasks: stack.yml

- name: Render the homeassistant configuration
  ansible.builtin.import_tasks: configuration.yml

- name: Activate the homeassistant service
  ansible.builtin.import_tasks: service.yml

- name: Integrate homeassistant with traefik
  ansible.builtin.import_tasks: traefik.yml
