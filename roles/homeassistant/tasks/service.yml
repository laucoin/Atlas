---
- name: Look up the docker service user's UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ homeassistant_service_user }}"

- name: Set the docker service user's UID as a fact
  ansible.builtin.set_fact:
    homeassistant_service_uid: "{{ ansible_facts.getent_passwd[homeassistant_service_user][1] }}"

- name: Render the homeassistant systemd unit
  ansible.builtin.template:
    src: homeassistant.service.j2
    dest: /etc/systemd/system/homeassistant.service
    owner: root
    group: root
    mode: "0644"
  register: homeassistant_unit

- name: Reload systemd if the unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: homeassistant_unit.changed

- name: Enable and start the homeassistant stack
  ansible.builtin.systemd:
    name: homeassistant
    enabled: true
    state: started

- name: Restart the homeassistant stack if its configuration changed
  ansible.builtin.systemd:
    name: homeassistant
    state: restarted
  when: >-
    homeassistant_compose.changed or homeassistant_unit.changed or
    homeassistant_configuration.changed or homeassistant_oidc_auth_install.changed
