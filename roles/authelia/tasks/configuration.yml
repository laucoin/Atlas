---
- name: Render the authelia configuration
  ansible.builtin.template:
    src: configuration.yml.j2
    dest: "{{ authelia_stack_dir }}/config/configuration.yml"
    owner: "{{ authelia_host_uid }}"
    group: "{{ authelia_host_uid }}"
    mode: "0640"
  register: authelia_configuration

- name: Render the users database
  ansible.builtin.template:
    src: users_database.yml.j2
    dest: "{{ authelia_stack_dir }}/config/users_database.yml"
    owner: "{{ authelia_host_uid }}"
    group: "{{ authelia_host_uid }}"
    mode: "0600"
  register: authelia_users_database
