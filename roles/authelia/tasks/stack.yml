---
# Rootless Docker maps each container's non-zero internal UID to a
# DIFFERENT host UID than the atlas-docker daemon user — namespace UID 0
# maps to the invoking user, N>0 maps into the declared subuid range
# (docker/defaults) as docker_subuid_start + N - 1. Anything bind-mounted
# INTO a container has to be owned by ITS OWN mapped UID, per container —
# postgres and redis are two different containers with two different
# UIDs, so they need two different computed owners, not one shared
# "authelia" identity.
- name: Compute each container's host-mapped UID
  ansible.builtin.set_fact:
    authelia_postgres_host_uid: "{{ docker_subuid_start + authelia_postgres_uid - 1 }}"
    authelia_redis_host_uid: "{{ docker_subuid_start + authelia_redis_uid - 1 }}"
    authelia_host_uid: "{{ docker_subuid_start + authelia_uid - 1 }}"

- name: Ensure the authelia stack directory exists
  ansible.builtin.file:
    path: "{{ authelia_stack_dir }}"
    state: directory
    owner: "{{ authelia_service_user }}"
    group: "{{ authelia_service_user }}"
    mode: "0750"

- name: Ensure the postgres data directory exists, owned for its container
  ansible.builtin.file:
    path: "{{ authelia_stack_dir }}/data/postgres"
    state: directory
    owner: "{{ authelia_postgres_host_uid }}"
    group: "{{ authelia_postgres_host_uid }}"
    mode: "0750"

- name: Ensure the redis data directory exists, owned for its container
  ansible.builtin.file:
    path: "{{ authelia_stack_dir }}/data/redis"
    state: directory
    owner: "{{ authelia_redis_host_uid }}"
    group: "{{ authelia_redis_host_uid }}"
    mode: "0750"

# Just a host-side staging directory — docker bind-mounts the individual
# files inside it, never the directory itself, so the container never
# needs to traverse it. Each file rendered into it gets the container's
# mapped UID at the point it's rendered (roles/authelia/tasks/
# configuration.yml), not here.
- name: Ensure the config directory exists
  ansible.builtin.file:
    path: "{{ authelia_stack_dir }}/config"
    state: directory
    owner: "{{ authelia_service_user }}"
    group: "{{ authelia_service_user }}"
    mode: "0750"

# Bind-mounted into the authelia container (./assets:/config/assets:ro,
# functional/features/unified-theme's accepted risk on portal branding) —
# needs the container's own mapped UID, same reasoning as config/postgres/
# redis above.
- name: Ensure the assets directory exists, owned for the container
  ansible.builtin.file:
    path: "{{ authelia_stack_dir }}/assets"
    state: directory
    owner: "{{ authelia_host_uid }}"
    group: "{{ authelia_host_uid }}"
    mode: "0750"

- name: Render the authelia Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ authelia_stack_dir }}/compose.yml"
    owner: "{{ authelia_service_user }}"
    group: "{{ authelia_service_user }}"
    mode: "0640"
  register: authelia_compose
