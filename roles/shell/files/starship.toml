# Managed by Ansible — roles/shell. Do not edit by hand.
# Trimmed port of laucoin/Ponos's dotfiles/starship/config.toml — the
# language-version segments (no dev toolchains live on Atlas), Kubernetes
# (no orchestrator, per ADR-001), Conda and git_metrics are dropped.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_purple)\
$os\
$username\
[](bg:color_pink fg:color_purple)\
$directory\
[](fg:color_pink bg:color_cyan)\
$git_branch\
$git_status\
$git_state\
[](fg:color_cyan)\
$line_break$character"""

add_newline = false
palette = 'dracula'

[palettes.dracula]
color_fg0 = '#f8f8f2'
color_bg0 = '#282a36'
color_purple = '#bd93f9'
color_pink = '#ff79c6'
color_cyan = '#8be9fd'
color_blue = '#6272a4'
color_comment = '#44475a'
color_red = '#ff5555'
color_orange = '#ffb86c'
color_green = '#006644'
color_yellow = '#f1fa8c'

[os]
disabled = false
style = "bg:color_purple fg:color_bg0"

[os.symbols]
Debian = ""

[username]
show_always = true
style_user = "bg:color_purple fg:color_bg0"
style_root = "bg:color_purple fg:color_bg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_bg0 bg:color_pink"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = " "
truncate_to_repo = true
read_only = " "
read_only_style = "fg:color_bg0 bg:color_pink"

[git_branch]
symbol = ""
style = "bg:color_cyan"
format = '[[ $symbol $branch ](fg:color_bg0 bg:color_cyan)]($style)'

[git_status]
style = "bg:color_cyan"
format = '[[($all_status$ahead_behind )](fg:color_bg0 bg:color_cyan)]($style)'

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'

[cmd_duration]
min_time = 2000
style = "bg:color_bg0"
format = '[[  $duration ](fg:color_yellow)]($style)'
