---
- name: Install zsh, Starship and plugins
  ansible.builtin.import_tasks: install.yml

- name: Deploy the zsh configuration
  ansible.builtin.import_tasks: configure.yml

- name: Deploy the Starship prompt configuration
  ansible.builtin.import_tasks: starship.yml

- name: Deploy the Vim configuration and theme
  ansible.builtin.import_tasks: vim.yml

- name: Deploy the port-inspection helpers
  ansible.builtin.import_tasks: port_helpers.yml

- name: Deploy the volume-usage helper
  ansible.builtin.import_tasks: volume_usage.yml
