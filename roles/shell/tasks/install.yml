---
- name: Install shell prerequisites
  ansible.builtin.apt:
    name:
      - zsh
      - git
    state: present

- name: Download the pinned Starship release
  ansible.builtin.get_url:
    url: "https://github.com/starship/starship/releases/download/v{{ shell_starship_version }}/starship-x86_64-unknown-linux-musl.tar.gz"
    dest: "/tmp/starship-{{ shell_starship_version }}.tar.gz"
    checksum: "{{ shell_starship_checksum }}"
    mode: "0644"

- name: Install the Starship binary
  ansible.builtin.unarchive:
    src: "/tmp/starship-{{ shell_starship_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/starship

- name: Clone zsh-autosuggestions for each account
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ item.home }}/.zsh/zsh-autosuggestions"
    version: master
    update: false
  loop: "{{ shell_targets }}"
  loop_control:
    label: "{{ item.user }}"

- name: Clone zsh-syntax-highlighting for each account
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    dest: "{{ item.home }}/.zsh/zsh-syntax-highlighting"
    version: master
    update: false
  loop: "{{ shell_targets }}"
  loop_control:
    label: "{{ item.user }}"

- name: Own each account's zsh plugin directory
  ansible.builtin.file:
    path: "{{ item.home }}/.zsh"
    state: directory
    recurse: true
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
  loop: "{{ shell_targets }}"
  loop_control:
    label: "{{ item.user }}"
