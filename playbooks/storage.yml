---
- name: Provision Atlas storage
  hosts: atlas
  become: true
  vars:
    storage_confirm: false
  pre_tasks:
    - name: Refuse to run without explicit confirmation
      ansible.builtin.assert:
        that: storage_confirm | bool
        fail_msg: >-
          Refusing to provision storage without confirmation. Re-run with
          -e storage_confirm=true after reviewing --check --diff.
  tasks:
    - name: Reconcile the declared storage layout
      ansible.builtin.import_role:
        name: storage
        tasks_from: reconcile

    - name: Carve /var/log out into its own volume
      ansible.builtin.import_role:
        name: storage
        tasks_from: carve_out_logs

    - name: Move application data from /var/data to /srv
      ansible.builtin.import_role:
        name: storage
        tasks_from: remount_application_data

    - name: Mount any newly-declared volume
      ansible.builtin.import_role:
        name: storage
        tasks_from: mount_new_volumes
