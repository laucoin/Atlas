---
atlas_timezone: Europe/Paris
atlas_locale: en_US.UTF-8

atlas_admin_user: atlas
# The maintainer's workstation SSH public key. Replace before the first converge.
atlas_admin_ssh_public_key: "CHANGE_ME"

# The gateway's external, internet-facing SSH port (see technical/network-
# topology and technical/index's diagram: "80 · 443 · 222 forwarded"). The
# gateway translates this to 22 before the packet ever reaches Atlas, so
# sshd itself listens on 22 (hardening_ssh_port) — deliberately not this
# value. This var exists for documentation, not for any role to consume.
atlas_ssh_port: 222
